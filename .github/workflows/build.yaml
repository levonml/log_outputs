name: Build and publish application

on:
  push:

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build --tag "levonml/4-7-pong-o:$GITHUB_SHA" ./pong-o
          docker push "levonml/4-7-pong-o:$GITHUB_SHA"
          docker build --tag "levonml/4-7-reader:$GITHUB_SHA" ./log_outputs/string-reader
          docker push "levonml/4-7-reader:$GITHUB_SHA"
          docker build --tag "levonml/4-7-writer:$GITHUB_SHA" ./log_outputs/string-writer
          docker push "levonml/4-7-writer:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        run: |-
          kustomize edit set image PROJECT/IMAGE-PINGPONG=levonml/4-7-pong-o:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE-READER=levonml/4-7-reader:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE-WRITER=levonml/4-7-writer:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}